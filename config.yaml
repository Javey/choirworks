server:
  host: 127.0.0.1
  port: 8567

llm:
  planner_model: openai/glm-5.1
  api_base: https://kspmas.ksyun.com/v1/
  timeout_seconds: 60
  max_plan_retries: 2

scheduler:
  max_parallel_nodes: 5
  node_timeout_seconds: 600
  max_node_attempts: 2
  retry_backoff_seconds: 1.0
  replan_on_failure: true
  max_plan_nodes: 20

recovery:
  replay_on_startup: true

store:
  db_path: ./data/choirworks.db

a2a:
  public_url: http://127.0.0.1:8567

sim:
  start_agents: true
  agents:
    - {name: product-manager, behavior: collaborate}
    - {name: developer, behavior: inquire}
    - {name: code-reviewer, behavior: review}
    - {name: qa-engineer, behavior: assist}
    - {name: finance-analyst, behavior: echo}
    - {name: approval-manager, behavior: flaky_once}
    - {name: auditor, behavior: flaky_always}
  chunk_size: 2
  chunk_delay: 0.04
