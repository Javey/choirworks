server:
  host: 127.0.0.1
  port: 8567

llm:
  planner_model: openai/gpt-4.1
  timeout_seconds: 60
  max_plan_retries: 2

scheduler:
  max_parallel_nodes: 5
  node_timeout_seconds: 600
  max_node_attempts: 2
  retry_backoff_seconds: 1.0
  replan_on_failure: true
  max_plan_nodes: 20

policies:
  default: auto_llm
  overrides:
    - agent_name: payment-agent
      policy: human
    - skill_id: deploy_prod
      policy: human

recovery:
  replay_on_startup: true

store:
  db_path: ./data/choirworks.db

a2a:
  public_url: http://127.0.0.1:8567
