[project]
name = "choirworks"
version = "0.1.0"
description = "ChoirWorks — 多 Agent 协作工作群（A2A 编排平台 MVP）"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server,sqlite]>=1.1,<2",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.28",
    "litellm>=1.100.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "uvicorn>=0.30",
]

[project.scripts]
choirworks = "choirworks.main:main"
choirworks-sim = "choirworks.sim.runner:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choirworks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
