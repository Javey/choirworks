[project]
name = "choirworks"
version = "0.1.0"
description = "ChoirWorks — 多 Agent 协作工作群（A2A 编排平台 MVP）"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server,sqlite]>=1.1,<2",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.28",
    "litellm>=1.100.1",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "uvicorn>=0.30",
]

[project.scripts]
choirworks = "choirworks.main:main"
choirworks-sim = "choirworks.sim.runner:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/choirworks", "src/new_choirworks"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "ASYNC109"]  # B008: FastAPI Depends(); ASYNC109: 内部方法需要 timeout 参数，与 ADK 一致

[tool.basedpyright]
include = ["src/new_choirworks/**", "tests/next/**"]
# 项目内存在有意为之的类型层循环（TYPE_CHECKING + 函数内延迟导入），
# 运行时无循环；保持可见但不再作为错误阻断。
reportImportCycles = "none"
reportMissingTypeStubs = "none"

# 测试中用私有名做断言/驱动很常见（如直接调 _seed_start_triggers），
# 只对 tests 放开，src 仍然生效。
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
